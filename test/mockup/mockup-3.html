<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="logos/auscope-icon-colour.png">
<title>M@TE mockup 3 — filter sidebar</title>
<link rel="stylesheet" href="mockup.css?v=7">
</head>
<body data-variant="3">
<!-- Mockup 3: closest to AusMT. A filter panel on the left, results on the right, nothing above them. -->

<main class="wrap cat">
  <aside class="filters" aria-label="Filter models">
    <input id="q" type="search" placeholder="Search title, author or topic" aria-label="Search models">

    <p class="label">Year</p>
    <div class="checks" id="years"></div>

    <p class="label">Topic</p>
    <div class="checks scroll" id="topics"></div>

    <button class="btn ghost" id="clear" type="button">Clear filters</button>

    <div class="about-box">
      <p class="label">About M@TE</p>
      <p>Open, citable computational models of Earth processes, each published with its inputs, outputs and a DOI.</p>
      <p><a href="#">How it works</a> · <a href="https://github.com/ModelAtlasofTheEarth/model-submission/issues/new?template=model_submission.yml">Submit a model</a></p>
    </div>
  </aside>

  <section class="results">
    <div class="toolbar">
      <h2>Models</h2>
      <span class="count" id="count"></span>
      <select id="sort" aria-label="Sort models">
        <option value="new">Newest first</option>
        <option value="old">Oldest first</option>
        <option value="az">Title A–Z</option>
      </select>
    </div>
    <div class="rows" id="rows"></div>
  </section>
</main>

<script src="data.js"></script>
<script src="mockup.js?v=9"></script>
<script>window.MATE.filterCatalogue('rowcard');</script>
</body>
</html>
